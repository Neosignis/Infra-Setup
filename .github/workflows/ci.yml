name: Foundation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-ephemeral-password
          POSTGRES_DB: neosignis
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python scripts/export_openapi.py --check
      - run: python scripts/check_repository.py
      - name: Validate database schema and non-owner tenant isolation
        env:
          PGPASSWORD: ci-only-ephemeral-password
        run: |
          psql -h localhost -U postgres -d neosignis -v ON_ERROR_STOP=1 -f db/migrations/001_foundation.sql
          psql -h localhost -U postgres -d neosignis -v ON_ERROR_STOP=1 -f tests/database_isolation.sql
      - name: Validate Compose and build image
        env:
          DEV_API_TOKEN: ci-only-not-a-deployment-secret-xxxxxxxxxxxxxxxx
        run: |
          docker compose config --quiet
          docker build -t neosignis-foundation:ci .
      - name: Check container boots without a model
        env:
          DEV_API_TOKEN: ci-only-not-a-deployment-secret-xxxxxxxxxxxxxxxx
        run: |
          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              docker compose ps -a || true
              docker compose logs --no-color --tail=200 api inference || true
            fi
            docker compose down || true
            exit "$status"
          }
          trap cleanup EXIT
          docker compose up -d --build
          python scripts/smoke_compose.py
  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/workbench/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: npm ci
        working-directory: apps/workbench
      - run: npm test
        working-directory: apps/workbench
      - run: npm run build
        working-directory: apps/workbench
      - run: npx playwright install --with-deps chromium
        working-directory: apps/workbench
      - run: npm run test:e2e
        working-directory: apps/workbench
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.14.0'
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/bootstrap init -backend=false -input=false
      - run: terraform -chdir=infra/bootstrap validate
      - run: terraform -chdir=infra/environments/dev init -backend=false -input=false
      - run: terraform -chdir=infra/environments/dev validate
      - run: terraform -chdir=infra/environments/dev test -no-color
